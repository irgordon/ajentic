name: ci

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  repository-validation:
    name: Repository validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"

      - name: Check Node security floor and runtime policy
        run: |
          node scripts/check_node_version.mjs
          node scripts/test_check_node_version.mjs

      - name: Validate repository structure
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/validate_structure.py

      - name: Validate documentation boundaries
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/validate_docs.py

      - name: Validate operator contract map
        run: python3 scripts/validate_operator_intent_contract_map.py

      - name: Run Rust boundary lint self-tests
        run: node scripts/test_rust_boundary_lint.mjs

      - name: Run Rust boundary lint
        run: node scripts/rust_boundary_lint.mjs

  rust:
    name: Rust
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CARGO_TARGET_DIR: /tmp/ajentic-ci-rust-target

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Rust surface exists
        id: rust-surface
        shell: bash
        run: |
          set -euo pipefail

          if [ -f core/Cargo.toml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Rust toolchain
        if: steps.rust-surface.outputs.present == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Check Rust formatting
        if: steps.rust-surface.outputs.present == 'true'
        run: cargo fmt --manifest-path core/Cargo.toml -- --check

      - name: Check Rust build
        if: steps.rust-surface.outputs.present == 'true'
        run: cargo check --manifest-path core/Cargo.toml --all-targets

      - name: Run Rust tests
        if: steps.rust-surface.outputs.present == 'true'
        run: cargo test --manifest-path core/Cargo.toml --all-targets

      - name: Run Clippy
        if: steps.rust-surface.outputs.present == 'true'
        run: cargo clippy --manifest-path core/Cargo.toml --all-targets -- -D warnings

  ui:
    name: TypeScript UI
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check UI surface exists
        id: ui-surface
        shell: bash
        run: |
          set -euo pipefail

          if [ -f ui/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: steps.ui-surface.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"

      - name: Detect package manager lockfile
        if: steps.ui-surface.outputs.present == 'true'
        id: lockfile
        working-directory: ui
        shell: bash
        run: |
          set -euo pipefail

          if [ -f package-lock.json ]; then
            echo "install=npm ci --no-audit --no-fund --fetch-retries=1 --fetch-timeout=15000" >> "$GITHUB_OUTPUT"
          elif [ -f pnpm-lock.yaml ]; then
            echo "install=corepack enable && pnpm install --frozen-lockfile" >> "$GITHUB_OUTPUT"
          elif [ -f yarn.lock ]; then
            echo "install=corepack enable && yarn install --immutable" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No UI lockfile found; falling back to npm install"
            echo "install=npm install" >> "$GITHUB_OUTPUT"
          fi

      - name: Install UI dependencies
        if: steps.ui-surface.outputs.present == 'true'
        working-directory: ui
        shell: bash
        run: ${{ steps.lockfile.outputs.install }}

      - name: Run UI typecheck
        if: steps.ui-surface.outputs.present == 'true'
        working-directory: ui
        run: npm run typecheck

      - name: Run UI boundary AST lint and self-tests
        if: steps.ui-surface.outputs.present == 'true'
        working-directory: ui
        run: npm run lint

      - name: Run UI build
        if: steps.ui-surface.outputs.present == 'true'
        working-directory: ui
        run: npm run build

      - name: Run UI API behavior tests
        if: steps.ui-surface.outputs.present == 'true'
        working-directory: ui
        run: npm run test:api

  node24-compatibility:
    name: Node 24 compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up supported Node 24 security release
        uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"
      - name: Check runtime policy
        run: |
          node scripts/check_node_version.mjs
          node scripts/test_check_node_version.mjs
      - name: Install locked dependencies
        run: npm ci --prefix ui --no-audit --no-fund --fetch-retries=1 --fetch-timeout=15000
      - name: Validate UI on Node 24
        working-directory: ui
        run: |
          npm run typecheck
          npm run lint
          npm run build
          npm run test:api
      - name: Validate contracts and license inventory on Node 24
        run: |
          node scripts/test_validate_schemas.mjs
          node scripts/validate_schemas.mjs
          node scripts/test_audit_dependency_licenses.mjs
          node scripts/audit_dependency_licenses.mjs

  schemas:
    name: Schemas
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install locked schema validation dependencies
        run: npm ci --prefix ui --no-audit --no-fund --fetch-retries=1 --fetch-timeout=15000

      - name: Test schema validator failure handling
        run: node scripts/test_validate_schemas.mjs

      - name: Audit reviewed dependency licenses
        run: |
          node scripts/test_audit_dependency_licenses.mjs
          node scripts/audit_dependency_licenses.mjs

      - name: Validate metaschemas, references, formats, and payload fixtures
        run: node scripts/validate_schemas.mjs

  scripts:
    name: Scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install checksum-verified actionlint
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/actionlint.tar.gz"
          curl --fail --show-error --location --retry 2 --max-time 60 \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            --output "${archive}"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum --check
          tar -xzf "${archive}" -C "${RUNNER_TEMP}" actionlint
          echo "${RUNNER_TEMP}" >> "$GITHUB_PATH"

      - name: Lint GitHub Actions workflows and embedded shell scripts
        run: actionlint -color

      - name: Run validation infrastructure and workflow-condition regression tests
        run: python3 -m unittest discover -s scripts -p 'test_validation_*.py'

      - name: Check shell scripts parse
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d scripts ]; then
            echo "scripts/ not present; shell script checks skipped."
            exit 0
          fi

          if find scripts -type f -name "*.sh" -print -quit | grep -q .; then
            find scripts -type f -name "*.sh" -print0 |
              xargs -0 -n1 bash -n
          else
            echo "No shell scripts found; parse check skipped."
          fi

  full-check:
    name: Full deterministic check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - repository-validation
      - rust
      - ui
      - node24-compatibility
      - schemas
      - scripts
    env:
      CARGO_TARGET_DIR: /tmp/ajentic-ci-full-target

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Detect UI package manager lockfile
        id: ui-lockfile
        working-directory: ui
        shell: bash
        run: |
          set -euo pipefail

          if [ -f package-lock.json ]; then
            echo "install=npm ci --no-audit --no-fund --fetch-retries=1 --fetch-timeout=15000" >> "$GITHUB_OUTPUT"
          elif [ -f pnpm-lock.yaml ]; then
            echo "install=corepack enable && pnpm install --frozen-lockfile" >> "$GITHUB_OUTPUT"
          elif [ -f yarn.lock ]; then
            echo "install=corepack enable && yarn install --immutable" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No UI lockfile found; falling back to npm install"
            echo "install=npm install" >> "$GITHUB_OUTPUT"
          fi

      - name: Install UI dependencies
        working-directory: ui
        shell: bash
        run: ${{ steps.ui-lockfile.outputs.install }}

      - name: Run full deterministic validation
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/check.sh
