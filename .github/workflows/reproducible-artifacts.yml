name: reproducible-artifacts

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  reproducible-artifacts:
    name: Internal candidate artifact reproducibility
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: UTC
      LC_ALL: C
      CARGO_INCREMENTAL: "0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set deterministic source date
        shell: bash
        run: |
          set -euo pipefail
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate internal candidate artifact reproducibility
        run: python3 scripts/reproducible_artifacts.py --check

      - name: Validate internal checksum SBOM and provenance evidence
        run: python3 scripts/reproducible_artifacts.py --check-evidence
