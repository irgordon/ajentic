name: release-candidate

on:
  workflow_dispatch:
    inputs:
      candidate_label:
        description: Internal candidate label, for example phase-191-smoke
        required: true
        default: phase-191-smoke
      expected_commit:
        description: Full commit SHA that the operator expects to package
        required: true
      upload_internal_artifact:
        description: Upload internal workflow artifact for short-retention review
        type: boolean
        required: true
        default: true
      attest_internal_artifact:
        description: Generate GitHub artifact attestations for the internal candidate bundle
        type: boolean
        required: true
        default: true
      confirm_no_public_release:
        description: Type NO_PUBLIC_RELEASE to confirm this workflow must not publish a GitHub Release
        required: true

permissions:
  contents: read

jobs:
  internal-candidate-bundle:
    name: Internal candidate bundle
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TZ: UTC
      LC_ALL: C
      CARGO_INCREMENTAL: "0"
      CARGO_TARGET_DIR: /tmp/ajentic-phase-191-workflow-target

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate manual release boundary inputs
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_SHA}" != "${{ inputs.expected_commit }}" ]; then
            echo "::error::expected_commit does not match checked-out commit"
            exit 1
          fi
          if [ "${{ inputs.confirm_no_public_release }}" != "NO_PUBLIC_RELEASE" ]; then
            echo "::error::confirm_no_public_release must be NO_PUBLIC_RELEASE"
            exit 1
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate deterministic internal candidate bundle
        run: python3 scripts/release_candidate_bundle.py --check

      - name: Build internal candidate bundle
        run: >
          python3 scripts/release_candidate_bundle.py
          --build
          --candidate-label "${{ inputs.candidate_label }}"
          --output-dir /tmp/ajentic-phase-191-internal-candidate

      - name: Verify bundle evidence exists
        shell: bash
        run: |
          set -euo pipefail
          test -f /tmp/ajentic-phase-191-internal-candidate/ajentic-internal-candidate.tar.gz
          test -f /tmp/ajentic-phase-191-internal-candidate/release-candidate-manifest.json
          test -f /tmp/ajentic-phase-191-internal-candidate/bundle-checksums.json
          test -f /tmp/ajentic-phase-191-internal-candidate/sbom-internal.json
          test -f /tmp/ajentic-phase-191-internal-candidate/provenance-internal.json

      - name: Verify package versions remain pre-v1
        shell: bash
        run: |
          set -euo pipefail
          if grep -R '"version"[[:space:]]*:[[:space:]]*"1.0.0"\|version[[:space:]]*=[[:space:]]*"1.0.0"' -n core/Cargo.toml ui/package.json; then
            echo "::error::package version must not be 1.0.0 in Phase 191"
            exit 1
          fi

      - name: Verify repository remains clean
        shell: bash
        run: |
          set -euo pipefail
          git diff --quiet -- .
          git diff --cached --quiet -- .

      - name: Write internal candidate summary
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Phase 191 internal candidate bundle"
            echo
            echo "- Internal candidate bundle generated."
            echo "- Internal attestation evidence may be generated in the attestation job."
            echo "- This is not a public release artifact."
            echo "- This is not v1 release execution."
            echo "- No GitHub Release, tag, package publication, installer, update channel, or deployment is created."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload internal candidate workflow artifact
        if: inputs.upload_internal_artifact
        uses: actions/upload-artifact@v4
        with:
          name: phase-191-internal-candidate-${{ inputs.candidate_label }}
          path: /tmp/ajentic-phase-191-internal-candidate/
          retention-days: 5
          if-no-files-found: error

  internal-candidate-attestation:
    name: Internal candidate attestation
    runs-on: ubuntu-latest
    needs: internal-candidate-bundle
    if: inputs.attest_internal_artifact
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      TZ: UTC
      LC_ALL: C
      CARGO_INCREMENTAL: "0"
      CARGO_TARGET_DIR: /tmp/ajentic-phase-191-attestation-target

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate manual release boundary inputs
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_SHA}" != "${{ inputs.expected_commit }}" ]; then
            echo "::error::expected_commit does not match checked-out commit"
            exit 1
          fi
          if [ "${{ inputs.confirm_no_public_release }}" != "NO_PUBLIC_RELEASE" ]; then
            echo "::error::confirm_no_public_release must be NO_PUBLIC_RELEASE"
            exit 1
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build internal candidate evidence for attestation
        run: >
          python3 scripts/release_candidate_bundle.py
          --build
          --candidate-label "${{ inputs.candidate_label }}"
          --output-dir /tmp/ajentic-phase-191-attestation-candidate

      - name: Attest internal candidate bundle
        uses: actions/attest@v4
        with:
          subject-path: /tmp/ajentic-phase-191-attestation-candidate/ajentic-internal-candidate.tar.gz

      - name: Attest internal SBOM evidence
        uses: actions/attest@v4
        with:
          subject-path: /tmp/ajentic-phase-191-attestation-candidate/sbom-internal.json

      - name: Verify repository remains clean
        shell: bash
        run: |
          set -euo pipefail
          git diff --quiet -- .
          git diff --cached --quiet -- .

      - name: Write internal attestation summary
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Phase 191 internal attestation evidence"
            echo
            echo "- GitHub artifact attestation was requested for the internal candidate bundle."
            echo "- GitHub artifact attestation was requested for internal SBOM evidence."
            echo "- Attestation evidence is internal release-candidate evidence."
            echo "- Attestation evidence is not public release approval."
            echo "- This is not a public release artifact and not v1 release execution."
          } >> "$GITHUB_STEP_SUMMARY"
